spring.application.name=product-stock-service
server.address=127.0.0.1
server.port=${LAB_PORT:18770}
spring.cloud.nacos.server-addr=${LAB_NACOS_SERVER:127.0.0.1:18760}
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.server-addr}
spring.cloud.nacos.discovery.ip=127.0.0.1
spring.cloud.nacos.config.server-addr=${spring.cloud.nacos.server-addr}
spring.config.import=optional:nacos:cloud-lab.properties?group=DEFAULT_GROUP&refreshEnabled=true
spring.datasource.url=${LAB_DB_URL:jdbc:mysql://127.0.0.1:3306/cloud_mall_lab}
spring.datasource.username=${LAB_DB_USER:root}
spring.datasource.password=${LAB_DB_PASSWORD:}
spring.data.redis.host=${LAB_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${LAB_REDIS_PORT:6379}
spring.data.redis.password=${LAB_REDIS_PASSWORD:}
spring.rabbitmq.host=${LAB_MQ_HOST:127.0.0.1}
spring.rabbitmq.port=${LAB_MQ_PORT:5672}
spring.rabbitmq.username=${LAB_MQ_USER:guest}
spring.rabbitmq.password=${LAB_MQ_PASSWORD:guest}
spring.cloud.openfeign.client.config.order-service.connect-timeout=700
spring.cloud.openfeign.client.config.order-service.read-timeout=1200
lab.stock.check-delay-ms=10000
lab.stock.retry-ms=2000
lab.stock.recovery-interval-ms=1000
lab.stock.queue-prefix=${LAB_MQ_PREFIX:cloud-mall-lab}
lab.stock.cache-prefix=${LAB_REDIS_PREFIX:cloud-mall-lab}
lab.product.delay-ms=0
lab.product.hot-qps=200
lab.instance=${LAB_INSTANCE:${server.port}}
logging.pattern.level=%5p [trace=%X{traceId}]

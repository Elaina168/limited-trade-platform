name: Compose 真实集成验收

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: trade-check-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 源码构建、空卷启动、重建与故障演练
        run: python3 scripts/verify-compose.py "$COMPOSE_PROJECT_NAME"

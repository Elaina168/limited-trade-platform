user nginx;
worker_processes auto;
worker_shutdown_timeout 5s;
pid /var/run/nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include ../nginx/http-common.conf;
    include vue-http.conf;

    # Docker 内置 DNS 可跟踪 Java 容器重建后服务名对应的新地址。
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream trade_backend {
        zone trade_backend 64k;
        server app:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        include vue-server.conf;
    }
}

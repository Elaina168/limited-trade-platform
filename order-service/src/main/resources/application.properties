spring.application.name=order-service
server.address=127.0.0.1
server.port=18780
spring.config.import=optional:nacos:cloud-lab.properties?group=DEFAULT_GROUP&refreshEnabled=true
spring.cloud.nacos.server-addr=${LAB_NACOS_SERVER:127.0.0.1:18760}
spring.cloud.nacos.discovery.ip=127.0.0.1
spring.cloud.loadbalancer.cache.enabled=false
feign.sentinel.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=400
spring.cloud.openfeign.client.config.default.readTimeout=1400
spring.datasource.url=${LAB_DB_URL}
spring.datasource.username=${LAB_DB_USER}
spring.datasource.password=${LAB_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.rabbitmq.host=${LAB_MQ_HOST:127.0.0.1}
spring.rabbitmq.port=${LAB_MQ_PORT:5672}
spring.rabbitmq.connection-timeout=750ms
spring.rabbitmq.username=${LAB_MQ_USER}
spring.rabbitmq.password=${LAB_MQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.task.scheduling.pool.size=2
management.endpoints.web.exposure.include=health,info
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{32} - %msg%n

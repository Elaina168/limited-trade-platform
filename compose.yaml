name: limited-trade-containers

x-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${COMPOSE_PROJECT_NAME:-limited-trade-containers}-web:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONTAINER_WEB_PORT:-18084}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      app:
        condition: service_healthy
    logging: *container-logging

  app:
    image: ${COMPOSE_PROJECT_NAME:-limited-trade-containers}-app:${APP_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-}
        APP_RELEASE_LABEL: ${APP_RELEASE_LABEL:-compose}
        APP_REQUIRED_MIGRATION: ${APP_REQUIRED_MIGRATION:-018_product_search_sync}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 单机演示凭据只用于本机；已有卷继续通过原环境文件提供凭据。
      SPRING_CONFIG_ON_NOT_FOUND: ignore
      DB_URL: jdbc:mysql://mysql:3306/limited_trade_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: limited_trade
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-demo-db}
      MQ_HOST: rabbitmq
      MQ_PORT: "5672"
      MQ_USERNAME: limited_trade
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-local-demo-mq}
      MQ_VIRTUAL_HOST: limited-trade
      APP_RELEASE_GATE_TRAFFIC: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      APP_INSTANCE_ID: ${APP_INSTANCE_ID:-container-app}
      SECKILL_ENABLED: ${SECKILL_ENABLED:-true}
      SEARCH_MODE: ${SEARCH_MODE:-mysql}
      ELASTICSEARCH_BASE_URL: ${ELASTICSEARCH_BASE_URL:-http://elasticsearch:9200}
      AGENT_ENABLED: ${AGENT_ENABLED:-}
      AGENT_RAG_ENABLED: ${AGENT_RAG_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SPRING_APPLICATION_JSON: ${APP_SPRING_JSON:-{}}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=75.0"
    volumes:
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *container-logging

  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-demo-root}
      MYSQL_DATABASE: limited_trade_platform
      MYSQL_USER: limited_trade
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-db}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/01-schema.sh
        target: /docker-entrypoint-initdb.d/01-schema.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./sql
        target: /bootstrap
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /var/lib/mysql/.bootstrap-incomplete && MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --host=127.0.0.1 --user=limited_trade --database=limited_trade_platform --batch --skip-column-names --execute='SELECT 1 FROM activity_coupon LIMIT 0; SELECT 1 FROM agent_conversation_visible_turn LIMIT 0; SELECT 1 FROM activity_purchase_reservation LIMIT 0; SELECT 1 FROM product_search_pending LIMIT 0'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *container-logging

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *container-logging

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: limited_trade
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-demo-mq}
      RABBITMQ_DEFAULT_VHOST: limited-trade
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${CONTAINER_RABBITMQ_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *container-logging

  elasticsearch:
    profiles: ["es"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    logging: *container-logging

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  app_logs:
  es_data:

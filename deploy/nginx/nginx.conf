# Windows便携版单实例入口，默认行为保持不变。
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 512; }
http {
    include http-common.conf;
    upstream trade_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }
    server {
        listen 127.0.0.1:18080;
        include server-common.conf;
    }
}

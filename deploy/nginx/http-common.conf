    server_tokens off;

    # 有后端响应时沿用其编号；网关自身错误使用入口生成的编号。
    map $upstream_http_x_trace_id $response_trace_id {
        ""      $request_id;
        default $upstream_http_x_trace_id;
    }

    # 只记录固定分类，不把URL参数、订单编号或任意用户路径写进访问日志。
    map $uri $route_group {
        default        other;
        /              page;
        /index.html    page;
        ~^/assets/     assets;
        ~^/api/        api;
        /nginx-health  health;
    }

    log_format trade_json escape=json
        '{"timestamp":"$time_iso8601","event":"nginx_access",'
        '"edgeTraceId":"$request_id","traceId":"$response_trace_id",'
        '"method":"$request_method","routeGroup":"$route_group",'
        '"status":$status,"upstreamStatus":"$upstream_status","upstream":"$upstream_addr",'
        '"requestSeconds":"$request_time","upstreamSeconds":"$upstream_response_time"}';
    access_log logs/access.log trade_json;

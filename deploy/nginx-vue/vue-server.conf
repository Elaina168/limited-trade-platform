client_max_body_size 1m;
add_header X-Trace-Id $response_trace_id always;
add_header Cache-Control $vue_cache_control always;

location = /nginx-health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
}

# 正则按声明顺序选择，流式端点先于其他 API。
location ~ ^/api/agent/conversations/[^/]+/messages/stream$ {
    include api-proxy.conf;
    proxy_read_timeout 310s;
    proxy_buffering off;
    proxy_ignore_client_abort off;
}

location ~ ^/api(?:/|$) {
    include api-proxy.conf;
    proxy_read_timeout 30s;
}

location /assets/ {
    try_files $uri =404;
}

location = /index.html {
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}

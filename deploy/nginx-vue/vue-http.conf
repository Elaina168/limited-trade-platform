types {
    text/html html;
    text/css css;
    application/javascript js;
}

# 内部回退后 $uri 为 /index.html。只缓存带构建哈希且成功返回的资源。
map "$status:$uri" $vue_cache_control {
    "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8}\.[^/]+$" "public, max-age=31536000, immutable";
    "~^[0-9]+:/index\.html$"                           "no-cache";
    default                                           "no-store";
}

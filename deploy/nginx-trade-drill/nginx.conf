# 仅用于隔离测试库的真实交易验收，不替换已有检查入口。
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 512; }
http {
    include ../nginx/http-common.conf;
    upstream trade_backend {
        server 127.0.0.1:8083 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8084 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }
    server {
        listen 127.0.0.1:18082;
        include ../nginx/server-common.conf;
    }
}

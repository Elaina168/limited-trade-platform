# 本机管理页面；密码和签名密钥由脚本从忽略的文件加载到进程环境。
[paths]
data = ${OBS_ROOT}/grafana/data
logs = ${OBS_ROOT}/grafana/logs
plugins = ${OBS_ROOT}/grafana/plugins
provisioning = ${PROJECT_ROOT}/deploy/observability/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://127.0.0.1:3000/

[security]
admin_user = admin
cookie_samesite = lax

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true
plugin_admin_enabled = false
public_key_retrieval_disabled = true

[log]
mode = console
level = info

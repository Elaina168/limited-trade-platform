# 双实例轮询，不使用粘性会话；登录态由Redis共享。
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 512; }
http {
    include ../nginx/http-common.conf;
    upstream trade_backend {
        server 127.0.0.1:8081 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }
    server {
        listen 127.0.0.1:18081;
        include ../nginx/server-common.conf;
    }
}

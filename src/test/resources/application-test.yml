spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/limited_trade_platform_test
  rabbitmq:
    virtual-host: ${mq.test-virtual-host}

# 测试手动调用扫描入口，避免后台任务干扰夹具和断言。
app:
  scheduling:
    enabled: false
  order-message:
    enabled: false
  # 既有回滚测试不向 Redis 发布事务中的夹具；缓存集成测试单独开启。
  product-cache:
    enabled: false
  order-timeout:
    enabled: false

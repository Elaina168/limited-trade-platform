spring:
  autoconfigure:
    # 默认保留单实例内存会话，shared-session通过显式配置启用Redis会话。
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  config:
    import:
      - file:./config/db.properties
      - file:./config/rabbitmq.properties
  application:
    name: limited-trade-platform
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  jackson:
    deserialization:
      accept-float-as-int: false
  rabbitmq:
    host: ${mq.host}
    port: ${mq.port}
    username: ${mq.username}
    password: ${mq.password}
    virtual-host: ${mq.virtual-host}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# 使用Spring Boot自带的Logstash JSON输出，不增加日志依赖。
logging:
  file:
    name: ${APP_LOG_FILE:logs/limited-trade-platform.log}
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        instance: ${APP_INSTANCE_ID:local}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true

app:
  order-rate-limit:
    enabled: true
    max-requests: 5
    window-seconds: 10
    key-prefix: limited-trade:rate-limit:order
  scheduling:
    enabled: true
  order-message:
    enabled: true
    name-prefix: limited-trade
    wait-ttl-ms: 900000
  product-cache:
    enabled: true
    key: limited-trade:product:on-sale:v1
